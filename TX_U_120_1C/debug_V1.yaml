substitutions:
  name: tx_ultimate_1c
  friendly_name: "TX Ultimate 1C"
  relay_count: "1"
  toggle_relay_1_on_touch: "true"
  vibra_time: 150ms
  button_on_time: 500ms
  relay_1_pin: GPIO18
  vibra_motor_pin: GPIO21
  pa_power_pin: GPIO26
  led_pin: GPIO13
  status_led_pin: GPIO33
  uart_tx_pin: GPIO19
  uart_rx_pin: GPIO22
  touchpanel_power_pin: GPIO5

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: tx_ultimate.debug
    version: "0.1.0-debug1"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    tx_ultimate_touch: DEBUG
    uart: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/sonyc2011/TX_Ultimate_120
      ref: main
    components: [tx_ultimate]

globals:
  - id: nightlight_color
    type: int [3]
    restore_value: no
    initial_value: "{80,70,0}"
  - id: button_color
    type: int [3]
    restore_value: no
    initial_value: "{0,0,100}"
  - id: long_press_color
    type: int [3]
    restore_value: no
    initial_value: "{100,0,0}"
  - id: multi_touch_color
    type: int [3]
    restore_value: no
    initial_value: "{0,0,0}"
  - id: swipe_left_color
    type: int [3]
    restore_value: no
    initial_value: "{0,100,0}"
  - id: swipe_right_color
    type: int [3]
    restore_value: no
    initial_value: "{100,70,0}"
  - id: touch_color
    type: int [3]
    restore_value: no
    initial_value: "{0,100,100}"

binary_sensor:
  - platform: template
    name: "Touchfield 1"
    id: touchfield_1
    on_press:
      - switch.toggle: relay_1
      - delay: 500ms
      - binary_sensor.template.publish:
          id: touchfield_1
          state: OFF

switch:
  - platform: gpio
    id: relay_1
    name: "${friendly_name} L1"
    pin: ${relay_1_pin}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    id: vibra
    pin: ${vibra_motor_pin}
    name: "${friendly_name} Vibration"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: ${vibra_time}
      - switch.turn_off: vibra

  - platform: gpio
    id: pa_power
    pin: ${pa_power_pin}
    name: "PA Power"
    internal: true
    restore_mode: ALWAYS_ON

  - platform: gpio
    name: "touch panel power"
    pin:
      number: ${touchpanel_power_pin}
      inverted: true
    id: touch_power
    internal: true
    restore_mode: RESTORE_DEFAULT_ON

uart:
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  id: my_uart
  baud_rate: 115200

tx_ultimate_touch:
  id: tx_touch
  uart: my_uart

  on_press:
    - switch.turn_on: vibra
    - lambda: >
        ESP_LOGD("touch", "PRESS x=%d state=%d", touch.x, touch.state);

  on_release:
    - switch.turn_on: vibra
    - lambda: >
        ESP_LOGD("touch", "RELEASE x=%d state=%d", touch.x, touch.state);

  on_swipe_left:
    - switch.turn_on: vibra

  on_swipe_right:
    - switch.turn_on: vibra

  on_full_touch_release:
    - switch.turn_on: vibra

  on_long_touch_release:
    - switch.turn_on: vibra
